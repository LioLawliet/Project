<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch+Pop&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-navbar">
        <label class="toggle-switch">
            <input type="checkbox" id="togglebtn">
            <span class="slider"></span>
        </label>
    </div>

    <div class="container">
        <div class="running-text" id="run-text">You Are in Light Mode</div>
        <div class="calculator">
            <div class="screen">0</div>
            <div class="baris-1">
                <button class="seven">7</button>
                <button class="eight">8</button>
                <button class="nine">9</button>
                <button class="divided">/</button>
            </div>

            <div class="baris-2">
                <button class="four">4</button>
                <button class="five">5</button>
                <button class="six">6</button>
                <button class="times">x</button>
            </div>

            <div class="baris-3">
                <button class="one">1</button>
                <button class="two">2</button>
                <button class="three">3</button>
                <button class="mines">-</button>
            </div>

            <div class="baris-4">
                <button class="zero">0</button>
                <button class="dot">•</button>
                <button class="equal">=</button>
                <button class="plus">+</button>
            </div>
            <div class="baris-5">
                <button class="reset">Clear</button>
            </div>
        </div>
    </div>
    <script src="data.js"></script>
</body>

</html>
